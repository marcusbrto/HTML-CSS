<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Projeto Instagram</title>
</head>
<body>
    <!--AREA WRAPPER-->
    <div id="wrapper">
        <!--AREA CONTAINER-->
        <div id="container">
            <!--AREA DA ESQUERDA-->
            <div class="column left">
                <div class="main">

                </div>
            </div>
            <!--FIM AREA DA ESQUERDA-->
            <!--AREA DA DIREITA-->
            <div class="column right">
                <div class="login-painel">
                    <div class="logo">
                        <img class="logo-img" src="assets/logo.png" alt="Logo do Instagram">
                    </div>
                    <form>
                        <input placeholder="Telefone, usuario ou email" type="text" name="username"/>
                        <input placeholder="Senha" type="password" name="password"/>
                        <input type="submit" value="Entrar"/>
                    </form>
                </div>
                <div class="infobox">
                    <p>Não tem uma conta? <a href="signup.html">Cadastre-se</a></p>
                </div>
                <div class="get-app-panel">
                    Obtenha o aplicativo.
                    <div class="app-buttons">
                        <a href="#"><img src="assets/appstore.png" alt="App Store"></a>
                        <a href="#"><img src="assets/googleplay.png" alt="Google Play"></a>
                </div>
            </div>
            <!--FIM AREA DA DIREITA-->
        </div>
        <!--FIM AREA CONTAINER-->
    </div>
     <!--AREA FOOTER-->
        <footer>
            <div class="footer-inner">
                <a href="#">About us</a>
                <a href="#">Support</a>
                <a href="#">Press</a>
                <a href="#">API</a>
                <a href="#">Jobs</a>
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
                <a href="#">Directory</a>
                <a href="#">Profiles</a>
                <a href="#">Hashtags</a>
                <a href="#">Language</a>
                <div class="text-small">© 2026 Instagram</div>
            </div>
</body>
</html>
