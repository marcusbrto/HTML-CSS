<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<body>
    <h1>Tabela</h1>
    <table border="1" cellpadding="15">
        <thead>
            <tr>
                <th>Marca</th>
                <th>Modelo</th>
                <th>Ano</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Ford</td>
                <td>Fiesta</td>
                <td>2015</td>
            </tr>
            <tr>
                <td>Fiat</td>
                <td>Uno</td>
                <td>1997</td>
            </tr>
            <tr>
                <td>Chevrolet</td>
                <td>Prisma</td>
                <td>2020</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
