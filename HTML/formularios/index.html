<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Formulários</h1>
    <form>
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required><br><br>

        <label for="Sobrenome">Sobrenome:</label>
        <input type="text" id="sobrenome" name="sobrenome"><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br><br>

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" required><br><br>

        <!-- 
            Tipo RADIO: Permite selecionar apenas uma opção entre várias.
        -->

        <label>
            <strong>Qual seu nível de programador atualmente?</strong>
        </label><br>
        
        <label>
            <input type="radio" name="nivel" value="iniciante" checked> Iniciante
        </label>
    
        <label>
            <input type="radio" id="intermediario" name="nivel" value="intermediario"> Intermediário
        </label>
        <label>
            <input type="radio" id="avancado" name="nivel" value="avancado"> Avançado<br><br>
        </label>
        <!--
            Tipo CHECKBOX: Permite selecionar múltiplas opções.
        -->
        <label>
            <strong>Quais linguagens de programação você conhece?</strong><br>
        </label>
        <label>
            <input type="checkbox" name="linguagens" value="python"> Python
        </label>
        <label>
            <input type="checkbox" name="linguagens" value="javascript"> JavaScript
        </label>
        <label>
            <input type="checkbox" name="linguagens" value="java"> Java<br><br>
        </label>

        <!--
            Tipo SELECT: Permite selecionar uma opção de um menu suspenso.
        -->
        <label for="pais">Selecione seu país:</label>
        <select id="pais" name="pais">
            <option selected disabled value="">Selecione</option>
            <option value="brasil">Brasil</option>
            <option value="estados_unidos">Estados Unidos</option>
            <option value="portugal">Portugal</option>
        </select><br><br>

        <!--
            Tipo DATE: Permite selecionar uma data.
        -->
        <label for="data_nascimento">Data de Nascimento:</label>
        <input type="date" id="data_nascimento" name="data_nascimento"><br><br>
        <input type="submit" value="Enviar Cadastro">
    </form>
</body>
</html>
