<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<body>
    <!-- Tabela é composta de linhas que são compostas de celulas.
        > <tr></tr> - são linhas da tabela / rows
        > <td></td> - define o cabeçalho de uma tabela / cells
        > <th></th> - define o título da tabela / header cells
    -->

    <h1>Trabalhando com tabelas</h1>

    <table>
        <caption>Minha tabela de exemplo</caption>
        <tr>
            <th>Ordem</th>
            <th>Serviço</th>
            <th>Valor</th>
            <th>Status</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Site</td>
            <td>R$ 2000,00</td>
            <td>Ativo</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Aplicativo</td>
            <td>R$ 5000,00</td>
            <td>Inativo</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Consultoria</td>
            <td>R$ 1000,00</td>
    </table>
</body>
</html>
