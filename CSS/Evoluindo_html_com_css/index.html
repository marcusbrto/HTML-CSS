<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Meu primeiro site</title>
</head>
<body>
    <!--
        1. Inline CSS: Estilo aplicado diretamente no elemento HTML usando o atributo "style". Exemplo: <p style="color: red;">Texto em vermelho</p>
        2. Internal CSS: Estilo definido dentro da tag <style> no cabeçalho do documento HTML. Exemplo:
            <style>
                p {
                    color: blue;
                }
            </style>
        3. External CSS: Estilo definido em um arquivo separado com extensão .css, que é vinculado ao documento HTML usando a tag <link>. Exemplo:
            <link rel="stylesheet" href="styles.css">
    -->
    <h1>Bem vindo ao meu projeto</h1>
</body>
</html>
