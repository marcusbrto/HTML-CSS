<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Seletores e classes</title>
</head>
<body>
    <!-- 
        > Usar classe: seleciona mais de um elemento.
        > Usar id: seleciona apenas um elemento.
    -->
    <h1 class="primeiro-h1">Seletores e classes</h1>

    <h1 id="titulo">Olá Mundo!</h1>

    <h1 class="primeiro-h1">Criando um título com classe</h1>
</body>
</html>
