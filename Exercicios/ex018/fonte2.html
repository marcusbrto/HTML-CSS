<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @font-face{
            font-family: 'Lacheyard';
            src: url('LacheyardScript.otf') format('opentype');
            font-weight: normal;
            font-style: normal;

            /* Tipos de format()
            - opentype (otf)
            - truetype (ttf)
            - embedded-opentype
            - truetype-aat (Apple Advanced TYpography)
            - svg */
        }
        p{
            font-family: Lacheyard, Times, Serif;
        }
    </style>
    <title>Font 2</title>
</head>
<body>
    <h1>Titulo 2</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptatem fugit sint corporis molestiae qui suscipit vitae aut nemo ab esse, et harum reiciendis possimus veritatis mollitia voluptates iste doloribus eius!</p>
</body>
</html>
