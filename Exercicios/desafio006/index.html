<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 006</title>
</head>
<body>
    <h1>Tags em HTML</h1>
    <p>Em HTML5, podemos inserir os elementos da lista a seguir. Passe o mouse sobre os termos para descobrir qual tag deverá utilizar em cada caso.</p>
    <ul>
        <li><abbr title="Use a tag <p>">Parágrafos</abbr></li>
        <li><abbr title="Use a tag <h1> até <h6>">Títulos</abbr></li>
        <li><abbr title="Use a tag <img> junto com href">Imagens</abbr></li>
        <li><abbr title="Use a tag <img> junto com href">Abreviações</abbr></li>
        <li><abbr title="Use a tag <ol>">Lista ordenada</abbr></li>
        <li><abbr title="Use a tag <ul>">Lista não ordenada</abbr></li>
        <li><abbr title="Use a tag <li>">Itens da lista</abbr></li>
        <li><abbr title="Use a tag <a> juntamente do href">Link externo</abbr></li>
    </ul>
</body>
</html>
