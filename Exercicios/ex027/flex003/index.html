<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initialExemplo de Bloco -scale=1.0">
    <title>Flexbox</title>
    <style>
        .container{
            background-color: lightcoral;
            
            display: flex;
            flex-direction: row;
            flex-flow: row wrap;
        }
        .item{
            background-color: lightgreen;
            border: 1px solid black;
            text-align: center;
            /* padding: 10px; */
            flex: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">Exemplo de Bloco A</div>
        <div class="item">Exemplo de Bloco B</div>
        <div class="item">Exemplo de Bloco C</div>
        <div class="item">Exemplo de Bloco D</div>
        <div class="item">Exemplo de Bloco E</div>
        <div class="item">Exemplo de Bloco F</div>
        <div class="item">Exemplo de Bloco G</div>
        <div class="item">Exemplo de Bloco H</div>
    </div>
</body>
</html>
