<body>
    <h1>Teste de Formulários</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <p><label for="iusuario">Usuário:</label>
        <input type="text" name="usuario" id="iusuario" required minlength="5" maxlength="15" size="10" placeholder="Username" autocomplete="username"></p>
        <p><label for="iusuario">Senha: </label>
        <input type="password" name="senha" id="isenha" required minlength="8" maxlength="20" size="10" autocomplete="current-password"></p>
        <p><input type="submit" value="Enviar"> <input type="reset" value="Limpar"></p>
    </form>
</body>
